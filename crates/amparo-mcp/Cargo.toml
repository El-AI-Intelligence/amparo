[package]
name = "amparo-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Amparo's MCP surface: serve amparo tools over Model Context Protocol, mount external MCP tools into the registry — both behind the policy gate"
readme = "README.md"
keywords = ['mcp', 'model-context', 'llm', 'tools']
categories = ['api-bindings', 'development-tools']

[[bin]]
name = "amparo-mcp-serve"
path = "src/main.rs"

[dependencies]
amparo-agent = { workspace = true }
amparo-inference = { workspace = true }
amparo-policy = { workspace = true }
amparo-privacy = { workspace = true }
amparo-sandbox = { workspace = true }
amparo-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tracing = "0.1"
