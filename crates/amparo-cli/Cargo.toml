[package]
name = "amparo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The amparo CLI: drive the agent loop end-to-end, serve tools over MCP — one binary, deny-by-default"
readme = "README.md"
keywords = ['cli', 'agent', 'llm', 'mcp', 'ai']
categories = ['command-line-interface', 'development-tools']

[[bin]]
name = "amparo"
path = "src/main.rs"

[dependencies]
amparo-agent = { workspace = true }
amparo-chat = { workspace = true }
amparo-inference = { workspace = true }
amparo-mcp = { workspace = true }
amparo-notebook = { workspace = true }
amparo-policy = { workspace = true }
amparo-privacy = { workspace = true }
amparo-sandbox = { workspace = true }
amparo-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# Raw terminal mode for `amparo tui` (single-keypress approval, width
# detection) — already in the workspace lockfile as a transitive dep.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows console input (KEY_EVENT records, UTF-16) and raw console mode
# for `amparo tui` — already in the workspace lockfile as a transitive
# dep of wasmtime; MSRV 1.60 <= 1.85.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
# Test-only: build the eval_wasm fixture module at test runtime (both are
# already workspace deps through amparo-sandbox).
base64 = "0.22"
wat = "1.0"
