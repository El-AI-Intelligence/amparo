[package]
name = "amparo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The amparo CLI: drive the agent loop end-to-end, serve tools over MCP — one binary, deny-by-default"
readme = "README.md"
keywords = ['cli', 'agent', 'llm', 'mcp', 'ai']
categories = ['command-line-interface', 'development-tools']

[[bin]]
name = "amparo"
path = "src/main.rs"

[dependencies]
amparo-agent = { path = "../amparo-agent" }
amparo-chat = { path = "../amparo-chat" }
amparo-inference = { path = "../amparo-inference" }
amparo-mcp = { path = "../amparo-mcp" }
amparo-notebook = { path = "../amparo-notebook" }
amparo-policy = { path = "../amparo-policy" }
amparo-privacy = { path = "../amparo-privacy" }
amparo-sandbox = { path = "../amparo-sandbox" }
amparo-tools = { path = "../amparo-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# Raw terminal mode for `amparo tui` (single-keypress approval, width
# detection) — already in the workspace lockfile as a transitive dep.
libc = "0.2"

[dev-dependencies]
# Test-only: build the eval_wasm fixture module at test runtime (both are
# already workspace deps through amparo-sandbox).
base64 = "0.22"
wat = "1.0"
