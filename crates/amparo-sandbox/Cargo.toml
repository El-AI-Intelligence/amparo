[package]
name = "amparo-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Amparo's fuel-metered WASM execution sandbox: bounded, import-free code evaluation"
readme = "README.md"
keywords = ['wasm', 'sandbox', 'webassembly', 'eval']
categories = ['wasm', 'development-tools']

[dependencies]
amparo-tools = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
base64 = "0.22"
# Pinned at 34: the newest wasmtime whose rust-version (1.85) still
# matches the workspace MSRV (audit 2026-08-31 MED-8; 35+ needs 1.86).
# `runtime` is the embedder API (Store/Module/Instance/Val) — since
# v18 it is feature-gated, not part of the defaults-off set.
wasmtime = { version = "34", default-features = false, features = ["cranelift", "runtime"] }

[dev-dependencies]
wat = "1.0"
