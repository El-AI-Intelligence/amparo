[package]
name = "amparo-inference"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "BYO-LLM inference layer for Amparo: OpenAI-compatible and Anthropic providers behind one trait"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"
