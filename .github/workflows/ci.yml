name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Pinned to the declared MSRV (1.85): wasmtime 34 is pinned in
      # amparo-sandbox because 35+ needs 1.86, so letting CI drift to
      # latest would silently change the floor the workspace targets.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - name: Test gate (zero warnings)
        run: cargo test --workspace
        env:
          RUSTFLAGS: "-D warnings"
      # The API-stability gate (missing_docs on every crate). Runs once,
      # on Linux; the test matrix above is the cross-platform gate.
      - name: Doc gate (zero warnings)
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
