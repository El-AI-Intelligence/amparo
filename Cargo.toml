[workspace]
resolver = "2"
members = ["crates/amparo-inference", "crates/amparo-memory", "crates/amparo-privacy", "crates/amparo-policy", "crates/amparo-tools", "crates/amparo-agent", "crates/amparo-mcp", "crates/amparo-cli", "crates/amparo-chat", "crates/amparo-notebook", "crates/amparo-sandbox"]

[workspace.package]
version = "0.13.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["EL AI Intelligence <Elai-intelligence@pm.me>"]
repository = "https://github.com/El-AI-Intelligence/amparo"

[workspace.dependencies]
# Internal crates — version pinned so `cargo publish` can rewrite path deps
# to registry deps; bump alongside [workspace.package].version.
amparo-agent = { version = "0.13.0", path = "crates/amparo-agent" }
amparo-chat = { version = "0.13.0", path = "crates/amparo-chat" }
amparo-cli = { version = "0.13.0", path = "crates/amparo-cli" }
amparo-inference = { version = "0.13.0", path = "crates/amparo-inference" }
amparo-mcp = { version = "0.13.0", path = "crates/amparo-mcp" }
amparo-memory = { version = "0.13.0", path = "crates/amparo-memory" }
amparo-notebook = { version = "0.13.0", path = "crates/amparo-notebook" }
amparo-policy = { version = "0.13.0", path = "crates/amparo-policy" }
amparo-privacy = { version = "0.13.0", path = "crates/amparo-privacy" }
amparo-sandbox = { version = "0.13.0", path = "crates/amparo-sandbox" }
amparo-tools = { version = "0.13.0", path = "crates/amparo-tools" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
async-trait = "0.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "time", "sync", "macros", "io-util", "io-std", "process", "fs", "net", "signal"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
